<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Impostor – Tu turno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111210;
      --lime: #c8f135;
      --text-white: #f5f5f0;
      --text-muted: #9a9a8e;
      --panel-bg: #1e1f1c;
      --panel-border: #2a2b27;
      --card-bg: #f0ede4;
      --card-text: #1a1a18;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .phone {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-bottom: 24px;
    }

    @media (min-width: 500px) {
      body { background: #0a0a0a; }
      .phone { max-width: 390px; }
    }

    /* ─── Status bar ─── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 0;
      height: 48px;
    }
    .status-time {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-white);
    }
    .status-icons { display: flex; align-items: center; gap: 7px; }
    .status-icons svg { fill: var(--text-white); }

    /* ─── Nav bar ─── */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 0;
    }

    .nav-back {
      width: 36px;
      height: 36px;
      background: #1e1f1c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-back svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-white);
      fill: none;
    }

    .nav-title {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
    }

    .nav-counter {
      background: #1e1f1c;
      border-radius: 20px;
      padding: 6px 13px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: 0.01em;
    }

    /* ─── Hero heading ─── */
    .hero {
      padding: 20px 22px 0;
    }

    .hero-name {
      font-family: 'Nunito', sans-serif;
      font-size: 34px;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .hero-sub {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ─── Progress dots ─── */
    .progress {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 22px 0;
    }

    .progress-dot {
      height: 4px;
      border-radius: 3px;
      background: #2e2f2b;
      flex: 1;
      transition: background 0.3s;
    }

    .progress-dot.done {
      background: var(--lime);
    }

    /* ─── Secret card ─── */
    .secret-card {
      margin: 16px 20px 0;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px 24px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--lime);
      color: #1a1a18;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .role-badge svg {
      width: 13px;
      height: 13px;
      stroke: #1a1a18;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .card-pretitle {
      font-size: 13px;
      font-weight: 600;
      color: #6b6b60;
      margin-bottom: 10px;
    }

    .secret-word {
      font-family: 'Nunito', sans-serif;
      font-size: 58px;
      font-weight: 900;
      color: var(--card-text);
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: uppercase;
    }

    .card-divider {
      width: 100%;
      height: 1px;
      background: rgba(0,0,0,0.1);
      margin: 20px 0 16px;
    }

    .card-category {
      font-size: 10.5px;
      font-weight: 800;
      color: #9a9a7a;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-description {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--card-text);
      line-height: 1.4;
    }

    .card-description-sub {
      margin-top: 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: #6b6b60;
    }

    /* ─── Hint strip ─── */
    .hint-strip {
      margin: 14px 20px 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .hint-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
    }

    .hint-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--lime);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hint-text {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* ─── Clue panel ─── */
    .clue-panel {
      margin: 12px 20px 0;
      border-left: 2.5px solid var(--lime);
      padding: 4px 0 4px 14px;
    }

    .clue-label {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: var(--lime);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .clue-text {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-white);
    }

    /* ─── Spacer ─── */
    .spacer { flex: 1; }

    /* ─── CTA ─── */
    .cta-wrap {
      padding: 18px 20px 0;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--lime);
      color: #111;
      border: none;
      border-radius: 18px;
      padding: 20px 26px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:active { transform: scale(0.97); }

    .btn-arrow {
      font-size: 22px;
      font-weight: 900;
    }

    .next-player {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* ─── Home indicator ─── */
    .home-indicator {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
    .home-indicator-bar {
      width: 120px;
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
    }


  </style>
</head>
<body>
<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="13" viewBox="0 0 17 13"><rect x="0" y="8" width="3" height="5" rx="0.8"/><rect x="4.5" y="5" width="3" height="8" rx="0.8"/><rect x="9" y="2" width="3" height="11" rx="0.8"/><rect x="13.5" y="0" width="3" height="13" rx="0.8"/></svg>
      <svg width="16" height="13" viewBox="0 0 16 13"><circle cx="8" cy="11.5" r="1.5"/><path d="M3.5 7.2A6.4 6.4 0 0 1 8 5.5c1.8 0 3.4.7 4.5 1.7" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M1 4A9.9 9.9 0 0 1 8 1c2.8 0 5.3 1.1 7 2.9" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <svg width="25" height="13" viewBox="0 0 25 13"><rect x="0" y="1" width="22" height="11" rx="2.5" stroke="white" stroke-width="1.2" fill="none"/><rect x="22.5" y="4" width="2" height="5" rx="1"/><rect x="1.5" y="2.5" width="17" height="8" rx="1.5"/></svg>
    </div>
  </div>

  <!-- Nav bar -->
  <div class="nav-bar">
    <div class="nav-back" onclick="window.history.back()">
      <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <span class="nav-title">Reparte el secreto</span>
    <div class="nav-counter">2 / 6</div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <h1 class="hero-name">Sofía, tu turno.</h1>
    <p class="hero-sub">Solo tú puedes mirar la pantalla.</p>
  </div>

  <!-- Progress -->
  <div class="progress">
    <div class="progress-dot done"></div>
    <div class="progress-dot done"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
  </div>

  <!-- Secret card -->
  <div class="secret-card">
    <div class="role-badge">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Eres inocente
    </div>

    <p class="card-pretitle">Tu palabra secreta es</p>

    <div class="secret-word">Playa</div>

    <div class="card-divider"></div>

    <p class="card-category">Lugares</p>
    <p class="card-description">Todos la conocen, menos uno.</p>
    <p class="card-description-sub">Descubre quién está fingiendo.</p>
  </div>

  <!-- Hint strip -->
  <div class="hint-strip">
    <div class="hint-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <span class="hint-text">Memorízala. Que nadie más la vea.</span>
  </div>

  <!-- Clue panel -->
  <div class="clue-panel">
    <div class="clue-label">La clave</div>
    <div class="clue-text">Da una pista sin decir la palabra.</div>
  </div>

  <div class="spacer"></div>

  <!-- CTA -->
  <div class="cta-wrap">
    <button class="btn-primary" onclick="alert('Siguiente jugador')">
      <span>Ocultar y pasar</span>
      <span class="btn-arrow">→</span>
    </button>
    <p class="next-player">Siguiente: Mateo</p>
  </div>

  <!-- Home indicator -->
  <div class="home-indicator">
    <div class="home-indicator-bar"></div>
  </div>

</div>
</body>
</html>
