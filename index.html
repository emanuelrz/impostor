<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impostor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111210;
      --lime: #c8f135;
      --coral: #f4634a;
      --card-green: #b5e04e;
      --text-white: #f5f5f0;
      --text-muted: #9a9a8e;
      --panel-bg: #1e1f1c;
      --panel-border: #2a2b27;
    }

    html {
      font-family: 'Nunito Sans', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
    }

    /* ─── MOBILE (base) ─── */

    .status-bar { display: none; }

    .header { padding: 10px 24px 0; }
    .brand {
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero { padding: 20px 24px 0; }
    .hero-title {
      font-family: 'Nunito', sans-serif;
      font-size: 34px;
      font-weight: 900;
      color: var(--text-white);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .hero-title .accent { color: var(--lime); }
    .hero-sub {
      margin-top: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ─── Cards area ─── */
    .cards-area {
      position: relative;
      margin: 20px 0 0;
      height: 240px;
      flex-shrink: 0;
    }

    .card {
      position: absolute;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
    }

    .card-coral {
      width: 180px;
      height: 220px;
      background: var(--coral);
      right: 10px;
      top: 0;
      transform: rotate(8deg);
      padding: 16px 18px;
      justify-content: space-between;
    }
    .card-coral .card-label {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card-coral .question-mark {
      font-family: 'Nunito', sans-serif;
      font-size: 110px;
      font-weight: 900;
      color: rgba(0,0,0,0.18);
      line-height: 1;
      text-align: right;
      margin-top: auto;
      margin-bottom: -10px;
      margin-right: -4px;
    }

    .card-green {
      width: 185px;
      height: 215px;
      background: var(--card-green);
      left: 20px;
      top: 14px;
      transform: rotate(-5deg);
      padding: 16px 18px 20px;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      z-index: 2;
    }
    .card-green .card-label {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: rgba(0,0,0,0.5);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .dots { display: flex; gap: 7px; margin-top: 20px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #1a1a1a; }
    .card-text {
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-top: auto;
    }

    .badge {
      position: absolute;
      bottom: 10px;
      right: 50px;
      background: #1e1f1c;
      color: var(--text-white);
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 20px;
      z-index: 10;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    /* ─── Info panel ─── */
    .info-panel {
      margin: 20px 20px 0;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
    }
    .info-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info-item + .info-item {
      border-left: 1px solid var(--panel-border);
      padding-left: 20px;
    }
    .info-icon { flex-shrink: 0; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .info-icon svg { width: 24px; height: 24px; }
    .info-text { display: flex; flex-direction: column; }
    .info-value {
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .info-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }

    /* ─── CTA ─── */
    .cta-wrap { padding: 22px 20px 0; }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--lime);
      color: #111;
      border: none;
      border-radius: 18px;
      padding: 20px 26px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: transform 0.12s ease, opacity 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-arrow { font-size: 22px; font-weight: 900; line-height: 1; }

    .how-to {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }
    .how-to-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .how-to-icon span { font-size: 11px; font-weight: 800; color: var(--text-muted); line-height: 1; }
    .how-to-text { font-size: 14px; font-weight: 700; color: var(--text-white); }

    .footer-note {
      margin-top: 24px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 20px;
    }

    .home-indicator { margin-top: 20px; display: flex; justify-content: center; }
    .home-indicator-bar { width: 120px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; }

    /* ─── TABLET (600px+) ─── */
    @media (min-width: 600px) {
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 40px 24px;
        background: #0c0d0b;
        min-height: 100vh;
      }

      .wrapper {
        width: 100%;
        max-width: 900px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
        gap: 0 48px;
        align-items: start;
      }

      .status-bar { display: none; }

      .col-left {
        display: flex;
        flex-direction: column;
        padding-top: 20px;
      }

      .col-right {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .header { padding: 0 0 0 0; }
      .brand { font-size: 18px; }

      .hero { padding: 20px 0 0; }
      .hero-title { font-size: 48px; }
      .hero-sub { font-size: 16px; margin-top: 12px; }

      .cards-area {
        margin: 32px 0 0;
        height: 300px;
      }

      .card-coral { width: 220px; height: 270px; }
      .card-coral .question-mark { font-size: 140px; }
      .card-green { width: 230px; height: 265px; }
      .card-green .card-label { font-size: 13px; }
      .card-text { font-size: 20px; }
      .dot { width: 13px; height: 13px; }
      .badge { font-size: 14px; padding: 8px 16px; right: 60px; bottom: 14px; }

      .info-panel { margin: 0; border-radius: 20px; padding: 20px 24px; }
      .info-value { font-size: 20px; }
      .info-label { font-size: 13px; }

      .cta-wrap { padding: 0; }
      .btn-primary { font-size: 20px; padding: 22px 28px; border-radius: 20px; }

      .how-to { margin-top: 16px; }
      .how-to-text { font-size: 15px; }

      .footer-note { font-size: 11px; margin-top: 20px; padding: 0; }
      .home-indicator { display: none; }
    }

    /* ─── DESKTOP (1024px+) ─── */
    @media (min-width: 1024px) {
      body { padding: 60px 48px; align-items: center; min-height: 100vh; }

      .wrapper { max-width: 1100px; gap: 0 80px; }

      .hero-title { font-size: 58px; }
      .hero-sub { font-size: 18px; }

      .cards-area { height: 340px; margin-top: 40px; }
      .card-coral { width: 250px; height: 310px; }
      .card-coral .question-mark { font-size: 160px; }
      .card-green { width: 260px; height: 300px; }
      .card-text { font-size: 22px; }
      .dot { width: 14px; height: 14px; }

      .info-value { font-size: 22px; }
      .btn-primary { font-size: 22px; }
    }
  </style>
</head>
<body>

  <!-- Mobile: flat layout. Tablet/Desktop: .wrapper grid -->
  <div class="wrapper">
    <div class="col-left">

      <!-- Status bar (mobile only) -->
      <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <svg width="17" height="13" viewBox="0 0 17 13"><rect x="0" y="8" width="3" height="5" rx="0.8"/><rect x="4.5" y="5" width="3" height="8" rx="0.8"/><rect x="9" y="2" width="3" height="11" rx="0.8"/><rect x="13.5" y="0" width="3" height="13" rx="0.8"/></svg>
          <svg width="16" height="13" viewBox="0 0 16 13"><circle cx="8" cy="11.5" r="1.5"/><path d="M3.5 7.2A6.4 6.4 0 0 1 8 5.5c1.8 0 3.4.7 4.5 1.7" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M1 4A9.9 9.9 0 0 1 8 1c2.8 0 5.3 1.1 7 2.9" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="25" height="13" viewBox="0 0 25 13"><rect x="0" y="1" width="22" height="11" rx="2.5" stroke="white" stroke-width="1.2" fill="none"/><rect x="22.5" y="4" width="2" height="5" rx="1"/><rect x="1.5" y="2.5" width="17" height="8" rx="1.5"/></svg>
        </div>
      </div>

      <!-- Brand -->
      <div class="header">
        <div class="brand">Impostor</div>
      </div>

      <!-- Hero text -->
      <div class="hero">
        <h1 class="hero-title">
          No confies en nadie<br>
          <span class="accent">Ni en tus amigos.</span>
        </h1>
        <p class="hero-sub">Una palabra. Un impostor.</p>
      </div>

      <!-- Cards (visible in left col on tablet/desktop) -->
      <div class="cards-area">
        <div class="card card-coral">
          <span class="card-label">¿Eres tú?</span>
          <div class="question-mark">?</div>
        </div>
        <div class="card card-green">
          <span class="card-label">Top Secret</span>
          <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
          <div class="card-text">Tú sí sabes<br>la palabra.</div>
        </div>
        <div class="badge">¿Quién finge?</div>
      </div>

    </div><!-- /col-left -->

    <div class="col-right">

      <!-- Info panel -->
      <div class="info-panel">
        <div class="info-item">
          <div class="info-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9a9a8e" stroke-width="1.8" stroke-linecap="round">
              <circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/>
              <path d="M2 20c0-3.3 2.7-6 6-6h8c3.3 0 6 2.7 6 6"/>
            </svg>
          </div>
          <div class="info-text">
            <span class="info-value">4–12</span>
            <span class="info-label">jugadores</span>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#f4634a" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
            </svg>
          </div>
          <div class="info-text">
            <span class="info-value">5–10 min</span>
            <span class="info-label">por partida</span>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-wrap">
        <a class="btn-primary" href="setup.html">
          <span>Crear partida</span>
          <span class="btn-arrow">→</span>
        </a>
      </div>

      <!-- How to play -->
      <div class="how-to">
        <div class="how-to-icon"><span>?</span></div>
        <span class="how-to-text">Cómo se juega</span>
      </div>

      <!-- Footer -->
      <p class="footer-note">UN SOLO CELULAR · CERO DESCARGAS EXTRA</p>

      <!-- Home indicator (mobile) -->
      <div class="home-indicator">
        <div class="home-indicator-bar"></div>
      </div>

    </div><!-- /col-right -->
  </div><!-- /wrapper -->

</body>
</html>
