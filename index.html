<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Impostor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111210;
      --lime: #c8f135;
      --coral: #f4634a;
      --card-green: #b5e04e;
      --card-green-dark: #a8d040;
      --text-white: #f5f5f0;
      --text-muted: #9a9a8e;
      --panel-bg: #1e1f1c;
      --panel-border: #2a2b27;
    }

    html, body {
      height: 100%;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    /* ─── Phone shell ─── */
    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-bottom: 24px;
    }

    /* ─── Status bar ─── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 0;
      height: 48px;
    }

    .status-time {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 0.01em;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-icons svg {
      fill: var(--text-white);
    }

    /* ─── Header ─── */
    .header {
      padding: 10px 24px 0;
    }

    .brand {
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ─── Hero text ─── */
    .hero {
      padding: 20px 24px 0;
    }

    .hero-title {
      font-family: 'Nunito', sans-serif;
      font-size: 34px;
      font-weight: 900;
      color: var(--text-white);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .hero-title .accent {
      color: var(--lime);
    }

    .hero-sub {
      margin-top: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    /* ─── Cards area ─── */
    .cards-area {
      position: relative;
      margin: 20px 0 0;
      height: 240px;
      flex-shrink: 0;
    }

    /* Back card (coral / red) */
    .card {
      position: absolute;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
    }

    .card-coral {
      width: 180px;
      height: 220px;
      background: var(--coral);
      right: 10px;
      top: 0;
      transform: rotate(8deg);
      padding: 16px 18px;
      justify-content: space-between;
    }

    .card-coral .card-label {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-coral .question-mark {
      font-family: 'Nunito', sans-serif;
      font-size: 110px;
      font-weight: 900;
      color: rgba(0,0,0,0.18);
      line-height: 1;
      text-align: right;
      margin-top: auto;
      margin-bottom: -10px;
      margin-right: -4px;
    }

    /* Front card (lime green) */
    .card-green {
      width: 185px;
      height: 215px;
      background: var(--card-green);
      left: 20px;
      top: 14px;
      transform: rotate(-5deg);
      padding: 16px 18px 20px;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      z-index: 2;
    }

    .card-green .card-label {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: rgba(0,0,0,0.5);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .dots {
      display: flex;
      gap: 7px;
      margin-top: 20px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #1a1a1a;
    }

    .card-text {
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-top: auto;
    }

    /* "¿Quién finge?" badge */
    .badge {
      position: absolute;
      bottom: 10px;
      right: 50px;
      background: #1e1f1c;
      color: var(--text-white);
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 20px;
      z-index: 10;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    /* ─── Info panel ─── */
    .info-panel {
      margin: 20px 20px 0;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .info-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-item + .info-item {
      border-left: 1px solid var(--panel-border);
      padding-left: 20px;
    }

    .info-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-icon svg {
      width: 24px;
      height: 24px;
    }

    .info-text {
      display: flex;
      flex-direction: column;
    }

    .info-value {
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .info-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ─── CTA Button ─── */
    .cta-wrap {
      padding: 22px 20px 0;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--lime);
      color: #111;
      border: none;
      border-radius: 18px;
      padding: 20px 26px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 2px 12px rgba(200, 241, 53, 0.25);
    }

    .btn-arrow {
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    /* ─── How to play link ─── */
    .how-to {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .how-to-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .how-to-icon span {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      line-height: 1;
    }

    .how-to-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 0.01em;
    }

    /* ─── Footer note ─── */
    .footer-note {
      margin-top: 24px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ─── Home indicator ─── */
    .home-indicator {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .home-indicator-bar {
      width: 120px;
      height: 5px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
    }

    /* ─── Responsive: full-bleed on actual phones ─── */
    @media (max-width: 430px) {
      .phone {
        max-width: 100%;
        min-height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <div class="phone">

    <!-- Status bar -->
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <!-- Signal bars -->
        <svg width="17" height="13" viewBox="0 0 17 13" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="8" width="3" height="5" rx="0.8"/>
          <rect x="4.5" y="5" width="3" height="8" rx="0.8"/>
          <rect x="9" y="2" width="3" height="11" rx="0.8"/>
          <rect x="13.5" y="0" width="3" height="13" rx="0.8"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="13" viewBox="0 0 16 13" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          <path d="M3.5 7.2A6.4 6.4 0 0 1 8 5.5c1.8 0 3.4.7 4.5 1.7" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M1 4A9.9 9.9 0 0 1 8 1c2.8 0 5.3 1.1 7 2.9" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <!-- Battery -->
        <svg width="25" height="13" viewBox="0 0 25 13" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="1" width="22" height="11" rx="2.5" stroke="white" stroke-width="1.2" fill="none"/>
          <rect x="22.5" y="4" width="2" height="5" rx="1"/>
          <rect x="1.5" y="2.5" width="17" height="8" rx="1.5"/>
        </svg>
      </div>
    </div>

    <!-- Brand header -->
    <div class="header">
      <div class="brand">Impostor</div>
    </div>

    <!-- Hero text -->
    <div class="hero">
      <h1 class="hero-title">
        No confies en nadie<br>
        <span class="accent">Ni en tus amigos.</span>
      </h1>
      <p class="hero-sub">Una palabra. Un impostor.</p>
    </div>

    <!-- Cards -->
    <div class="cards-area">
      <!-- Coral card (back) -->
      <div class="card card-coral">
        <span class="card-label">¿Eres tú?</span>
        <div class="question-mark">?</div>
      </div>

      <!-- Green card (front) -->
      <div class="card card-green">
        <span class="card-label">Top Secret</span>
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="card-text">Tú sí sabes<br>la palabra.</div>
      </div>

      <!-- Badge -->
      <div class="badge">¿Quién finge?</div>
    </div>

    <!-- Info panel -->
    <div class="info-panel">
      <div class="info-item">
        <div class="info-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="3" stroke="#9a9a8e" stroke-width="1.8"/>
            <circle cx="16" cy="8" r="3" stroke="#9a9a8e" stroke-width="1.8"/>
            <path d="M2 20c0-3.3 2.7-6 6-6h8c3.3 0 6 2.7 6 6" stroke="#9a9a8e" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="info-text">
          <span class="info-value">4–12</span>
          <span class="info-label">jugadores</span>
        </div>
      </div>
      <div class="info-item">
        <div class="info-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="#f4634a" stroke-width="1.8"/>
            <path d="M12 7v5l3 3" stroke="#f4634a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="info-text">
          <span class="info-value">5–10 min</span>
          <span class="info-label">por partida</span>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-wrap">
      <button class="btn-primary" onclick="alert('¡Crear partida!')">
        <span>Crear partida</span>
        <span class="btn-arrow">→</span>
      </button>
    </div>

    <!-- How to play -->
    <div class="how-to" onclick="alert('Cómo se juega')">
      <div class="how-to-icon">
        <span>?</span>
      </div>
      <span class="how-to-text">Cómo se juega</span>
    </div>

    <!-- Footer note -->
    <p class="footer-note">UN SOLO CELULAR · CERO DESCARGAS EXTRA</p>

    <!-- Home indicator -->
    <div class="home-indicator">
      <div class="home-indicator-bar"></div>
    </div>

  </div>
</body>
</html>
